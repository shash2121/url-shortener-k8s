apiVersion: v1
kind: ConfigMap
metadata:
  name: linkshrink-config
data:
  JWT_EXPIRES_IN: "15m"
  REFRESH_TOKEN_EXPIRES_IN: "7d"
  AUTH_PORT: "3001"
  URL_PORT: "3002"
  ANALYTICS_PORT: "3003"
  CLEANUP_PORT: "3004"
  AUTH_SERVICE_URL: "http://auth-service:3001"
  BASE_URL: "http://localhost"
  POSTGRES_DB: "urlshortener"
  POSTGRES_USER: "postgres"
  REDIS_MAXMEMORY: "allkeys-lfu"
