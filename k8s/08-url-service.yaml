---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-service
  template:
    metadata:
      labels:
        app: url-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres..."; sleep 2; done
        - name: wait-for-redis
          image: busybox
          command:
            - sh
            - -c
            - until nc -z redis 6379; do echo "waiting for redis..."; sleep 2; done
        - name: wait-for-rabbitmq
          image: busybox
          command:
            - sh
            - -c
            - until nc -z rabbitmq 5672; do echo "waiting for rabbitmq..."; sleep 2; done
      containers:
        - name: url-service
          image: sha2121/url-svc:latest
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: URL_PORT
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: AUTH_SERVICE_URL
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: BASE_URL
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/urlshortener"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkshrink-secret
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: url-service

spec:
  selector:
    app: url-service
  ports:
    - port: 3002
      targetPort: 3002
