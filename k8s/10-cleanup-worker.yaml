---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanup-worker

spec:
  replicas: 1
  selector:
    matchLabels:
      app: cleanup-worker
  template:
    metadata:
      labels:
        app: cleanup-worker
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres..."; sleep 2; done
        - name: wait-for-redis
          image: busybox
          command:
            - sh
            - -c
            - until nc -z redis 6379; do echo "waiting for redis..."; sleep 2; done
      containers:
        - name: cleanup-worker
          image: sha2121/cleanup-svc:latest
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: CLEANUP_PORT
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/urlshortener"
            - name: REDIS_URL
              value: "redis://redis:6379"
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: cleanup-worker

spec:
  selector:
    app: cleanup-worker
  ports:
    - port: 3004
      targetPort: 3004
