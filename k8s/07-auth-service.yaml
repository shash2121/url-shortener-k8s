---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "waiting for postgres..."; sleep 2; done
        - name: wait-for-redis
          image: busybox
          command:
            - sh
            - -c
            - until nc -z redis 6379; do echo "waiting for redis..."; sleep 2; done
      containers:
        - name: auth-service
          image: sha2121/auth-svc:latest
          ports:
            - containerPort: 3001
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkshrink-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: JWT_EXPIRES_IN
            - name: REFRESH_TOKEN_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: REFRESH_TOKEN_EXPIRES_IN
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: AUTH_PORT
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@postgres:5432/urlshortener"
            - name: REDIS_URL
              value: "redis://redis:6379"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service

spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
