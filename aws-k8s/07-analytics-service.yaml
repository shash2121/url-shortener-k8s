apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      serviceAccountName: linkshrink
      containers:
        - name: analytics-service
          image: sha2121/analytics-svc:amd64
          ports:
            - containerPort: 3003
          env:
            # DB parts from ConfigMap
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: DB_NAME
            # Credentials from Secrets Manager
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: linkshrink-aws-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkshrink-aws-secret
                  key: DB_PASSWORD
            # Assembled DATABASE_URL
            - name: DATABASE_URL
              value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=no-verify"
            # SQS from ConfigMap
            - name: SQS_VISIT_QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: SQS_VISIT_QUEUE_URL
            # App config
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: ANALYTICS_PORT
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: AWS_REGION
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: linkshrink-aws-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
spec:
  selector:
    app: analytics-service
  ports:
    - port: 3003
      targetPort: 3003
