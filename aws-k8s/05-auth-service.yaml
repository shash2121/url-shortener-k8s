apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: linkshrink
      containers:
        - name: auth-service
          image: sha2121/auth-svc:amd64
          ports:
            - containerPort: 3001
          env:
            # DB parts from ConfigMap (non-sensitive)
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: DB_NAME
            # Credentials from Secrets Manager
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: linkshrink-aws-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: linkshrink-aws-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: linkshrink-aws-secret
                  key: JWT_SECRET
            # Assembled DATABASE_URL (vars above must be defined first)
            - name: DATABASE_URL
              value: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=no-verify"
            # Redis from ConfigMap
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: REDIS_URL
            # App config
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: JWT_EXPIRES_IN
            - name: REFRESH_TOKEN_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: REFRESH_TOKEN_EXPIRES_IN
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: linkshrink-config
                  key: AUTH_PORT
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: linkshrink-aws-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector: 
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
